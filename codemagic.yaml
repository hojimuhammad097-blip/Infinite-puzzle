workflows:
  android-build:
    name: Android Build
    instance_type: mac_mini_m2
    environment:
      flutter: 3.22.3
    scripts:
      - name: Clean
        script: |
          flutter clean
          cd android
          chmod +x ./gradlew
          ./gradlew clean
          cd ..
      - name: Get packages
        script: flutter pub get
      - name: Build
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
